<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div id="setup">
      <h1>Job Matcher</h1>
      <p id="setupHint" class="hint">Gemini-API-Schl&uuml;ssel hinterlegen:</p>
      <input id="apiKey" type="password" placeholder="Schl&uuml;ssel eingeben&hellip;" />
      <button id="saveKey" class="btn primary">Speichern</button>
      <span id="keyError" class="err"></span>
    </div>
    <div id="main" hidden>
      <h1>Job Matcher</h1>
      <div id="providerBadge" class="provider-badge"></div>
      <div class="row">
        <button id="analyzeBtn" class="btn primary">Stelle pr&uuml;fen</button>
        <button id="uploadBtn" class="btn">Lebenslauf</button>
      </div>
      <div id="cvStatus" class="status"></div>
      <input id="fileInput" type="file" accept=".pdf" class="file-input" />
      <details>
        <summary>Manuelle Eingabe</summary>
        <textarea id="manualJobInput" rows="6" placeholder="Stellenanzeige hier einf&uuml;gen oder URL eingeben..." style="width:100%;border:1px solid var(--border);border-radius:4px;padding:6px;font:inherit;font-size:12px;resize:vertical;box-sizing:border-box;margin-top:6px"></textarea>
        <button id="manualAnalyzeBtn" class="btn small" style="margin-top:4px">Mit Text analysieren</button>
      </details>
      <div id="result" class="result"></div>
      <div class="row">
        <button id="openOptions" class="btn small">Einstellungen</button>
        <button id="changeKey" class="btn small">Schl&uuml;ssel &auml;ndern</button>
      </div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
