[project]
name = "job-matcher-ai"
version = "2.0.0"
description = "Legal-compliant AI job matching assistant — draft-only, local LLM (Ollama), official job APIs (Adzuna, Indeed). GDPR/DSGVO compliant."
authors = [
    { name = "Job Matcher AI Contributors" },
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.12"
keywords = ["job-search", "ai", "cover-letter", "gdpr", "dsgvo", "ollama", "adzuna", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "typer>=0.9",
    "rich>=13.0",
]

[project.scripts]
job-matcher = "job_matcher_ai.cli.app:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "respx>=0.21",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["job_matcher_ai"]
branch = true

[tool.coverage.report]
show_missing = true
